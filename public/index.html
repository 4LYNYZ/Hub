<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied / Protected Page</title>
    <style>
        body { background: #0b0f19; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #111827; padding: 40px; border-radius: 12px; border: 1px solid #1f2937; text-align: center; max-width: 400px; }
        h1 { color: #ef4444; font-size: 22px; margin-bottom: 10px; }
        p { color: #9ca3af; font-size: 14px; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="box">
        <h1>403 Forbidden</h1>
        <p>This is a protected script endpoint. Direct browser access is restricted. Please use this link inside a Roblox executor via loadstring.</p>
    </div>
</body>
</html>
